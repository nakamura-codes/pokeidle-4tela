name: Build APK
on:
  push:
    branches: [ "main", "master" ] # Evita gerar release em qualquer branch/teste
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# Cancela execuções antigas na mesma branch se você fizer um novo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Cancela o job se passar de 15 minutos para economizar cota

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pokeidle.mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pokeidle.mobile
          path: pokeidle.mobile.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" pokeidle.mobile.apk \
            --title "PokeIdle v${{ github.run_number }}" \
            --notes "Atualização do PokeIdle (versão ${{ github.run_number }})." \
            --latest
