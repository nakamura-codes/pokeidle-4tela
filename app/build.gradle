plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Número da build vem do GitHub Actions (-PbuildNumber=...). É ele que permite ao app
// saber se existe uma versão mais nova.
def buildNumber = (project.findProperty("buildNumber") ?: "1").toString().toInteger()

android {
    namespace 'com.pedro.idlekeeper'
    compileSdk 34
    defaultConfig {
        applicationId "com.pedro.idlekeeper2"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }
    // Chave fixa: sem ela, cada build sairia com uma assinatura diferente
    // e o Android recusaria a atualização por cima do app instalado.
    signingConfigs {
        pk {
            storeFile file("pokeidle.keystore")
            storeType "pkcs12"
            storePassword "pokeidle123"
            keyAlias "pokeidle"
            keyPassword "pokeidle123"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.pk
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
